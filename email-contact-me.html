<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>email-contact-me</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
          color: white;
    background-image: url(contact.jpg);
    background-size: cover;

    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    align-items: center;
           
        }
    form{
          padding:25px;
    background: rgba(27, 26, 26, 0.219);
    backdrop-filter: blur(5px);
    max-width: 400px;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 3px 5px black;
    border: 2px #88ff00 solid;
    color: white;
    
    
    }
    input{
            width: 100%;
    padding: 14px;
    margin-bottom:15px;
    align-items: center;
    border-radius:8px;
    font-size: 18px;
    outline: none;
    border: #88ff00 1.5px solid;
    background: rgba(0, 0, 0, 0.345);
   color: white;
    }

    textarea{
        padding: 25px 15px;
        border-radius: 20px;
        outline: none;
        border: 1px solid #88ff00;
         background: rgba(0, 0, 0, 0.345);
        color: white;
    }
    button{
        padding: 10px 15px;
        border-radius: 10px;
        border:1px solid #88ff00;
        background: #222320c4;
        box-shadow: 1px 5px 10px;
        color: #88ff00;
    }
    p{
        margin-bottom: 10px;
        font-family: 'Courier New', Courier, monospace;
    }
  
    </style>
</head>
<body>
    <form action="https://formsubmit.co/braisonsanga19@gmail.com" method="post">
       <p>Hey,here you are free to chat with us,to ask for any services that you want, and if you have any question you can ask here.</p>

        <div class="box">
            <input type="text" name="name" placeholder="Enter your name" required>
        </div>

        <div class="box">
            <input type="email" name="emai" placeholder="Enter your email" required>
        </div>

        <div class="box">
            <textarea name="message"  placeholder="Write here......"></textarea>
        </div>
        <button class="submit">Send</button>
    </form>
</body>
</html>
